name: Windows build and headless regression checks
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore tests and application
        run: dotnet restore ARCYN/ARCYN.Tests/ARCYN.Tests.csproj
      - name: Build and run regression checks (no windows)
        run: ./ARCYN/tools/Test-Arcyn.ps1
      - name: Publish and validate complete standalone artifact
        run: ./ARCYN/tools/Publish-Arcyn.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ARCYN-win-x64
          path: publish/*-release.zip
          if-no-files-found: error

