name: Windows build and headless regression checks
on:
  push:
    branches: [master, codex/arcyn-lightweight]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore tests and application
        run: dotnet restore ARCYN/ARCYN.Tests/ARCYN.Tests.csproj --interactive false
      - name: Build and run regression checks (no windows)
        run: ./ARCYN/tools/Test-Arcyn.ps1
      - name: Validate scripts without desktop changes
        run: ./ARCYN/tools/Test-Scripts.ps1
      - name: Build the performance probe without running it
        run: dotnet build ARCYN/tools/Probe/Probe.csproj -c Release --interactive false
      - name: Publish and validate complete standalone artifact
        run: ./ARCYN/tools/Publish-Arcyn.ps1
      - name: Reject incorrect standalone runtime metadata
        run: ./ARCYN/tools/Test-ArtifactMetadata.ps1 -Directory publish/ARCYN-v1.6.0-win-x64
      - uses: actions/upload-artifact@v6
        with:
          name: ARCYN-v1.6.0-win-x64
          path: |
            publish/ARCYN-v1.6.0-win-x64.zip
            publish/ARCYN-v1.6.0-win-x64.zip.sha256
          if-no-files-found: error

